apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appointment-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/appointment-system.git' # TODO: Replace with your actual Git repo URL
    targetRevision: HEAD
    path: helm  # The directory containing your Chart.yaml
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: appointment-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
